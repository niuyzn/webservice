<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가상 휴대폰 화면</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* 휴대폰 외곽 프레임 */
    .phone-frame {
      width: 360px;
      height: 720px;
      background: #1c1c1e;
      border-radius: 44px;
      padding: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      position: relative;
    }
    /* 상단 카메라인 노치 */
    .notch {
      width: 120px;
      height: 24px;
      background: #1c1c1e;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    /* 휴대폰 액선 화면 */
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 34px;
      overflow-y: auto;
      padding: 50px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile-icon {
      width: 80px;
      height: 80px;
      background: #e5e5ea;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-top: 20px;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 20px;
      color: #1c1c1e;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #8e8e93;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .card {
      width: 100%;
      background: #f2f2f7;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 15px;
      font-weight: bold;
      color: #1c1c1e;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 13px;
      color: #636366;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #007aff;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      border-radius: 14px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="notch"></div>
    <div class="phone-screen">
      <div class="profile-icon">📱</div>
      <h1>가상 휴대폰 화면</h1>
      <p>GitHub과 Cloudflare Pages로 배포된 모바일 웹페이지입니다.</p>

      <div class="card">
        <div class="card-title">💡 기능 안내</div>
        <div class="card-desc">이 영역에 원하는 텍스트나 이미지를 자유롭게 추가해보세요.</div>
      </div>

      <a href="#" class="btn">시작하기</a>
    </div>
  </div>

</body>
</html>
